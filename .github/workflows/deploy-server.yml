name: Deploy Server

on:
  push:
    branches: [master]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-server-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API to Production
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ssh.mendola.tech
          username: aeml
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          protocol: tcp
          timeout: 30s
          proxy_timeout: 30s
          command_timeout: 10m
          curl_insecure: false
          capture_stdout: false
          script: |
            set -euo pipefail
            cd /home/aeml/eidolon
            git fetch origin master
            EXPECTED_SHA="$(git rev-parse origin/master)"
            echo "Expected origin/master: ${EXPECTED_SHA}"
            git reset --hard origin/master
            git clean -fd
            ACTUAL_SHA="$(git rev-parse HEAD)"
            echo "Checked out HEAD: ${ACTUAL_SHA}"
            if [ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]; then
              echo "Deployed checkout does not match origin/master" >&2
              exit 1
            fi
            cd server
            CLEAN_SERVER_TREE=true ./deploy/deploy_linux.sh
