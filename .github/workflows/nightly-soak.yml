name: Nightly Multiplayer Soak

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: Soak duration understood by Go (for example 10m or 2h)
        required: false
        default: 24h

permissions:
  contents: read

concurrency:
  group: nightly-multiplayer-soak
  cancel-in-progress: false

jobs:
  soak:
    name: 100-client authoritative-state soak
    # Never occupy the deployment/GPU runner for the uninterrupted 24-hour soak.
    runs-on: [self-hosted, linux, x64, eidolon-soak]
    if: github.repository == 'aeml/eidolon' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')))
    timeout-minutes: 1500
    env:
      SOAK_DURATION: ${{ inputs.duration || '24h' }}
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017/tcp
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.5'
          cache-dependency-path: server/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Run multiplayer soak
        id: soak
        env:
          MONGO_URI: mongodb://127.0.0.1:${{ job.services.mongodb.ports[27017] }}
          SOAK_DISPOSABLE_DATABASE: '1'
        run: node scripts/run-nightly-soak.mjs

      - name: Upload soak evidence
        if: ${{ !cancelled() && steps.soak.outputs.evidence-dir != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-soak-${{ github.run_id }}
          path: |
            ${{ steps.soak.outputs.evidence-dir }}/soak-*.log
            ${{ steps.soak.outputs.evidence-dir }}/soak-runtime.jsonl
          if-no-files-found: warn
          retention-days: 14
