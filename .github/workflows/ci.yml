name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Client-side tests with Jest
  client-tests:
    name: Client Tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Audit production and development dependencies
        run: npm audit --audit-level=low

      - name: Run tests with coverage
        run: npm test -- --coverage --coverageReporters=lcov --coverageReporters=text

      - name: Run client hot-path benchmark
        run: npm run benchmark:client

      - name: Upload client coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-coverage
          path: coverage/
          retention-days: 7

  # Server-side tests with Go
  server-tests:
    name: Server Tests (Go)
    runs-on: ubuntu-latest
    env:
      MONGO_URI: mongodb://localhost:27017
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.5'
          cache-dependency-path: server/go.sum

      - name: Run Go tests with coverage
        working-directory: server
        run: |
          go test -v -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out

      - name: Run Go race detector
        working-directory: server
        run: go test -race ./...

      - name: Run server hot-path benchmarks
        working-directory: server
        run: go test -run='^$' -bench=. -benchmem -benchtime=250ms ./...

      - name: Build server
        working-directory: server
        run: go build -trimpath ./...

      - name: Convert Go coverage to LCOV
        working-directory: server
        run: |
          go install github.com/jandelgado/gcov2lcov@v1.1.1
          gcov2lcov -infile=coverage.out -outfile=coverage.lcov

      - name: Upload server coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-coverage
          path: server/coverage.lcov
          retention-days: 7

  browser-smoke:
    name: Browser Smoke (Playwright)
    needs: [client-tests, server-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies and browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run anonymous real-browser smoke
        run: npm run test:e2e:anonymous

      - name: Upload browser failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: predeploy-browser-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  predeploy-character:
    name: Predeploy Character QA (System Chrome)
    needs: [browser-smoke]
    runs-on: [self-hosted, linux, x64, eidolon-live-browser]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    env:
      EIDOLON_E2E_WEB_PORT: '41873'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install dependencies and verify system Chrome
        run: |
          npm ci
          test -x /usr/bin/google-chrome
          /usr/bin/google-chrome --version
          sg render -c 'EIDOLON_E2E_BROWSER_PATH=/usr/bin/google-chrome npm run verify:browser-gpu'

      - name: Run deterministic High/Low animation gallery
        env:
          EIDOLON_E2E_BROWSER_PATH: /usr/bin/google-chrome
        run: sg render -c 'npm run test:e2e:animations'

      - name: Run disposable full-character gameplay
        env:
          EIDOLON_E2E_BROWSER_PATH: /usr/bin/google-chrome
        run: sg render -c 'npm run test:e2e:isolated'

      - name: Upload predeploy character evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: predeploy-character-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  release-inputs:
    name: Validate Production QA Inputs
    needs: [predeploy-character]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    steps:
      - name: Require a dedicated primary account and consistent optional secondary account
        env:
          QA_USERNAME: ${{ secrets.EIDOLON_E2E_USERNAME }}
          QA_PASSWORD: ${{ secrets.EIDOLON_E2E_PASSWORD }}
          QA_USERNAME_SECONDARY: ${{ secrets.EIDOLON_E2E_USERNAME_SECONDARY }}
          QA_PASSWORD_SECONDARY: ${{ secrets.EIDOLON_E2E_PASSWORD_SECONDARY }}
        run: |
          if [ -z "${QA_USERNAME}" ] || [ -z "${QA_PASSWORD}" ]; then
            echo "Dedicated primary QA credentials are required for the production release gate." >&2
            exit 1
          fi
          if { [ -n "${QA_USERNAME_SECONDARY}" ] && [ -z "${QA_PASSWORD_SECONDARY}" ]; } || \
             { [ -z "${QA_USERNAME_SECONDARY}" ] && [ -n "${QA_PASSWORD_SECONDARY}" ]; }; then
            echo "Secondary QA username/password must be supplied together." >&2
            exit 1
          fi
          if ! [[ "${QA_USERNAME}" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "Primary QA username must use only letters, numbers, dot, underscore, or hyphen." >&2
            exit 1
          fi
          if [ "${#QA_USERNAME}" -gt 30 ]; then
            echo "Primary QA username must be at most 30 characters so dedicated class suffixes fit." >&2
            exit 1
          fi
          if [ -n "${QA_USERNAME_SECONDARY}" ] && ! [[ "${QA_USERNAME_SECONDARY}" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "Secondary QA username must use only letters, numbers, dot, underscore, or hyphen." >&2
            exit 1
          fi

  # Build site with coverage reports and deploy to GitHub Pages
  deploy:
    name: Deploy to GitHub Pages
    needs: [client-tests, server-tests, browser-smoke, release-inputs]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Prepare locked browser runtime
        run: npm ci

      - name: Download client coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: client-coverage
          path: coverage-client

      - name: Download server coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: server-coverage
          path: coverage-server

      - name: Prepare site with coverage reports
        run: |
          # Copy the entire game to public/ (preserves eidolon.mendola.tech)
          mkdir -p public
          cp -r index.html assets src vendor public/
          cp sw.js public/
          node scripts/version-pages-runtime.mjs public "${GITHUB_SHA}"
          printf '{"commit":"%s","version":"Alpha 1.0.12"}\n' "${GITHUB_SHA}" > public/release.json
          
          # Create coverage directory
          mkdir -p public/coverage/client public/coverage/server

          # Generate client HTML report
          if [ -f coverage-client/lcov.info ]; then
            genhtml coverage-client/lcov.info \
              --output-directory public/coverage/client \
              --title "Eidolon Client Coverage" \
              --legend --show-details
            
            # Extract client coverage percentage for badge
            CLIENT_COV=$(lcov --summary coverage-client/lcov.info 2>&1 | grep -oP 'lines\.*:\s*\K[0-9.]+' || echo "0")
            echo "CLIENT_COV=$CLIENT_COV" >> $GITHUB_ENV
          fi

          # Generate server HTML report  
          if [ -f coverage-server/coverage.lcov ]; then
            genhtml coverage-server/coverage.lcov \
              --output-directory public/coverage/server \
              --title "Eidolon Server Coverage" \
              --legend --show-details
            
            # Extract server coverage percentage for badge
            SERVER_COV=$(lcov --summary coverage-server/coverage.lcov 2>&1 | grep -oP 'lines\.*:\s*\K[0-9.]+' || echo "0")
            echo "SERVER_COV=$SERVER_COV" >> $GITHUB_ENV
          fi

          # Create coverage index page
          cat > public/coverage/index.html << 'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Eidolon - Coverage Reports</title>
            <style>
              body {
                font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
                margin: 0;
                padding: 2rem;
                background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
                min-height: 100vh;
                color: #e0e0e0;
              }
              .container { max-width: 800px; margin: 0 auto; }
              h1 { color: #00d4ff; text-align: center; font-size: 2.5rem; margin-bottom: 0.5rem; }
              .subtitle { text-align: center; color: #888; margin-bottom: 2rem; }
              .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
              .card {
                background: rgba(255,255,255,0.05);
                border: 1px solid rgba(255,255,255,0.1);
                border-radius: 12px;
                padding: 1.5rem;
                text-decoration: none;
                color: inherit;
                transition: transform 0.2s, box-shadow 0.2s;
              }
              .card:hover {
                transform: translateY(-4px);
                box-shadow: 0 8px 30px rgba(0,212,255,0.2);
                border-color: #00d4ff;
              }
              .card h2 { color: #00d4ff; margin-top: 0; }
              .card p { color: #aaa; margin-bottom: 0; }
              .tech-badge {
                display: inline-block;
                background: rgba(0,212,255,0.2);
                color: #00d4ff;
                padding: 0.25rem 0.75rem;
                border-radius: 20px;
                font-size: 0.85rem;
                margin-top: 1rem;
              }
              .back-link { text-align: center; margin-top: 2rem; }
              .back-link a { color: #00d4ff; }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>⚔️ Eidolon</h1>
              <p class="subtitle">Code Coverage Reports</p>
              <div class="cards">
                <a href="client/" class="card">
                  <h2>🎮 Client Coverage</h2>
                  <p>JavaScript/Three.js game client test coverage report generated by Jest.</p>
                  <span class="tech-badge">JavaScript • Jest • LCOV</span>
                </a>
                <a href="server/" class="card">
                  <h2>🖥️ Server Coverage</h2>
                  <p>Go WebSocket server test coverage report generated by go test.</p>
                  <span class="tech-badge">Go • gcov2lcov • LCOV</span>
                </a>
              </div>
              <p class="back-link"><a href="/">← Back to Game</a></p>
            </div>
          </body>
          </html>
          HTML

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # Deploy server via SSH to remote host
  deploy-server:
    name: Deploy Server (SSH)
    needs: [client-tests, server-tests, browser-smoke, release-inputs]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    steps:
      - name: Configure SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ssh.mendola.tech >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        env:
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          QA_USERNAME: ${{ secrets.EIDOLON_E2E_USERNAME }}
          QA_USERNAME_SECONDARY: ${{ secrets.EIDOLON_E2E_USERNAME_SECONDARY }}
        run: |
          qa_usernames="${QA_USERNAME}"
          for class_suffix in f r w c; do
            qa_usernames="${qa_usernames},${QA_USERNAME}-${class_suffix}"
          done
          if [ -n "${QA_USERNAME_SECONDARY}" ]; then
            qa_usernames="${qa_usernames},${QA_USERNAME_SECONDARY}"
          fi
          qa_usernames_b64="$(printf '%s' "${qa_usernames}" | base64 -w0)"
          ssh -o BatchMode=yes aeml@ssh.mendola.tech \
            "REF_NAME='${REF_NAME}' COMMIT_SHA='${COMMIT_SHA}' QA_USERNAMES_B64='${qa_usernames_b64}' bash -se" <<'EOF'
          set -euo pipefail
          cd /home/aeml/eidolon
          git fetch origin "${REF_NAME}"
          EXPECTED_SHA="$(git rev-parse origin/${REF_NAME})"
          echo "Expected origin/${REF_NAME}: ${EXPECTED_SHA}"
          git reset --hard origin/${REF_NAME}
          git clean -fd
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Checked out HEAD: ${ACTUAL_SHA}"
          if [ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "Deployed checkout does not match origin/${REF_NAME}" >&2
            exit 1
          fi
          if [ "${ACTUAL_SHA}" != "${COMMIT_SHA}" ]; then
            echo "Deployed checkout does not match workflow commit ${COMMIT_SHA}" >&2
            exit 1
          fi
          cd server
          qa_usernames="$(printf '%s' "${QA_USERNAMES_B64}" | base64 --decode)"
          qa_env_tmp="$(mktemp .env.qa.XXXXXX)"
          trap 'rm -f "${qa_env_tmp}"' EXIT
          awk -v value="${qa_usernames}" '
            BEGIN { found = 0 }
            /^EIDOLON_QA_USERNAMES=/ {
              print "EIDOLON_QA_USERNAMES=" value
              found = 1
              next
            }
            { print }
            END {
              if (!found) print "EIDOLON_QA_USERNAMES=" value
            }
          ' .env > "${qa_env_tmp}"
          chmod --reference=.env "${qa_env_tmp}"
          mv "${qa_env_tmp}" .env
          trap - EXIT
          CLEAN_SERVER_TREE=true EIDOLON_BUILD_COMMIT="${COMMIT_SHA}" EIDOLON_BUILD_VERSION="Alpha 1.0.12" bash ./deploy/deploy_linux.sh
          EOF

  post-deploy-browser:
    name: Live Release and Character QA
    needs: [deploy, deploy-server]
    runs-on: [self-hosted, linux, x64, eidolon-live-browser]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install dependencies and verify system Chrome
        run: |
          npm ci
          test -x /usr/bin/google-chrome
          /usr/bin/google-chrome --version
          sg render -c 'EIDOLON_E2E_BROWSER_PATH=/usr/bin/google-chrome npm run verify:browser-gpu'

      - name: Wait for matching live releases
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 60); do
            client_commit="$(curl -fsS -H 'Cache-Control: no-cache' "https://eidolon.mendola.tech/release.json?expected=${EXPECTED_COMMIT}&attempt=${attempt}" 2>/dev/null | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p' || true)"
            client_runtime_release="$(curl -fsS -H 'Cache-Control: no-cache' "https://eidolon.mendola.tech/?release=${EXPECTED_COMMIT}&attempt=${attempt}" 2>/dev/null | sed -n 's/.*src\/main\.js?release=\([^"]*\)".*/\1/p' | tail -1 || true)"
            server_commit="$(curl -fsS -H 'Cache-Control: no-cache' "https://eserver.mendola.tech/healthz?expected=${EXPECTED_COMMIT}&attempt=${attempt}" 2>/dev/null | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p' || true)"
            if [ "${client_commit}" = "${EXPECTED_COMMIT}" ] && \
               [ "${client_runtime_release}" = "${EXPECTED_COMMIT}" ] && \
               [ "${server_commit}" = "${EXPECTED_COMMIT}" ]; then
              exit 0
            fi
            if [ "${attempt}" -eq 60 ]; then
              echo "Live release mismatch: client=${client_commit:-unavailable} runtime=${client_runtime_release:-unavailable} server=${server_commit:-unavailable} expected=${EXPECTED_COMMIT}" >&2
              exit 1
            fi
            sleep 5
          done

      - name: Run live anonymous and persistent-character QA
        env:
          EIDOLON_E2E_BASE_URL: https://eidolon.mendola.tech
          EIDOLON_E2E_WS_URL: wss://eserver.mendola.tech/ws
          EIDOLON_E2E_HEALTH_URL: https://eserver.mendola.tech/healthz
          EIDOLON_E2E_BROWSER_PATH: /usr/bin/google-chrome
          EIDOLON_E2E_BACKEND_ORIGIN_IP: ${{ secrets.EIDOLON_E2E_BACKEND_ORIGIN_IP }}
          EIDOLON_EXPECTED_COMMIT: ${{ github.sha }}
          EIDOLON_E2E_USERNAME: ${{ secrets.EIDOLON_E2E_USERNAME }}
          EIDOLON_E2E_PASSWORD: ${{ secrets.EIDOLON_E2E_PASSWORD }}
          EIDOLON_E2E_CLASS: ${{ secrets.EIDOLON_E2E_CLASS }}
          EIDOLON_E2E_USERNAME_SECONDARY: ${{ secrets.EIDOLON_E2E_USERNAME_SECONDARY }}
          EIDOLON_E2E_PASSWORD_SECONDARY: ${{ secrets.EIDOLON_E2E_PASSWORD_SECONDARY }}
          EIDOLON_E2E_CLASS_SECONDARY: ${{ secrets.EIDOLON_E2E_CLASS_SECONDARY }}
          EIDOLON_E2E_FULL_GAMEPLAY: '1'
          EIDOLON_E2E_PORTAL_ONLY: '1'
        run: sg render -c 'npx playwright test tests/e2e/anonymous.spec.js tests/e2e/authenticated.spec.js tests/e2e/regional-dungeon-gameplay.spec.js tests/e2e/verdant-dungeon-gameplay.spec.js tests/e2e/movement-smoothness.spec.js'

      - name: Run live four-class and remote-animation QA
        env:
          EIDOLON_E2E_BASE_URL: https://eidolon.mendola.tech
          EIDOLON_E2E_WS_URL: wss://eserver.mendola.tech/ws
          EIDOLON_E2E_HEALTH_URL: https://eserver.mendola.tech/healthz
          EIDOLON_E2E_BROWSER_PATH: /usr/bin/google-chrome
          EIDOLON_E2E_BACKEND_ORIGIN_IP: ${{ secrets.EIDOLON_E2E_BACKEND_ORIGIN_IP }}
          EIDOLON_EXPECTED_COMMIT: ${{ github.sha }}
          EIDOLON_E2E_USERNAME: ${{ secrets.EIDOLON_E2E_USERNAME }}
          EIDOLON_E2E_PASSWORD: ${{ secrets.EIDOLON_E2E_PASSWORD }}
        run: sg render -c 'npm run test:e2e:live-animations'

      - name: Sanitize live browser evidence
        id: sanitize_evidence
        if: ${{ always() }}
        env:
          EIDOLON_E2E_USERNAME: ${{ secrets.EIDOLON_E2E_USERNAME }}
          EIDOLON_E2E_PASSWORD: ${{ secrets.EIDOLON_E2E_PASSWORD }}
          EIDOLON_E2E_USERNAME_SECONDARY: ${{ secrets.EIDOLON_E2E_USERNAME_SECONDARY }}
          EIDOLON_E2E_PASSWORD_SECONDARY: ${{ secrets.EIDOLON_E2E_PASSWORD_SECONDARY }}
        run: node scripts/sanitize-playwright-artifacts.mjs

      - name: Upload live browser evidence
        if: ${{ !cancelled() && steps.sanitize_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-browser-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
