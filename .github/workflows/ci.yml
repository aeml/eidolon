name: Release 1.0.14 diagnostic only (no deployment)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  diagnose-live-click:
    runs-on: [self-hosted, linux, x64, eidolon-live-browser]
    timeout-minutes: 45
    env:
      EIDOLON_E2E_BASE_URL: https://eidolon.mendola.tech
      EIDOLON_E2E_WS_URL: wss://eserver.mendola.tech/ws
      EIDOLON_E2E_HEALTH_URL: https://eserver.mendola.tech/healthz
      EIDOLON_E2E_BROWSER_PATH: /usr/bin/google-chrome
      EIDOLON_E2E_BACKEND_ORIGIN_IP: ${{ secrets.EIDOLON_E2E_BACKEND_ORIGIN_IP }}
      EIDOLON_EXPECTED_COMMIT: af3757b668da11cc932c9e93b7a0f770259d334b
      EIDOLON_E2E_USERNAME: ${{ secrets.EIDOLON_E2E_USERNAME }}
      EIDOLON_E2E_PASSWORD: ${{ secrets.EIDOLON_E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Verify exact deployed frontend and backend
        run: |
          node --input-type=module -e '
            for (const url of [process.env.EIDOLON_E2E_BASE_URL + "/release.json", process.env.EIDOLON_E2E_HEALTH_URL]) {
              const response = await fetch(url + "?diagnostic=" + Date.now(), {headers: {"Cache-Control": "no-cache"}});
              if (!response.ok) throw new Error("Release endpoint failed: " + response.status);
              const release = await response.json();
              if (release.commit !== process.env.EIDOLON_EXPECTED_COMMIT) throw new Error("Unexpected live commit: " + release.commit);
              console.log("Exact release verified:", release.commit);
            }
          '
      - name: Reproduce original four-class and remote-animation sequence
        run: sg render -c 'npm run test:e2e:live-animations'
      - name: Sanitize diagnostic evidence
        id: sanitize
        if: ${{ always() }}
        run: node scripts/sanitize-playwright-artifacts.mjs
      - name: Upload sanitized evidence
        if: ${{ !cancelled() && steps.sanitize.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release14-click-diagnostic-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
