# Install in /etc/nginx/conf.d/ (http context), before enabling the site.
# Never log raw queries, client addresses, referrers, user agents or credentials.
# Only the public 40-character release identity is retained from query data.
map $arg_release $eidolon_delivery_release {
    default "-";
    "~^[0-9a-f]{40}$" $arg_release;
}

log_format eidolon_delivery escape=json
    '{"time":"$time_iso8601","requestId":"$request_id",'
    '"method":"$request_method","path":"$uri",'
    '"release":"$eidolon_delivery_release","status":$status,'
    '"bytes":$body_bytes_sent,"requestSeconds":"$request_time",'
    '"upstreamStatus":"$upstream_status","upstreamRequestId":"$upstream_http_x_github_request_id",'
    '"connectSeconds":"$upstream_connect_time",'
    '"headerSeconds":"$upstream_header_time",'
    '"upstreamSeconds":"$upstream_response_time",'
    '"cache":"$upstream_cache_status"}';
