# Additive migration: do not replace the existing eidolon.conf.
# After installing/enabling this file, Certbot adds HTTPS and HTTP redirects.
server {
    listen 80;
    listen [::]:80;
    server_name play.eidolonrealms.com;
    # Overrides inherited combined access logging for this frontend only.
    access_log /var/log/nginx/eidolon-delivery.log eidolon_delivery;

    location / {
        # This host uses systemd-resolved and currently has no public IPv6 route.
        # Use a variable so nginx's runtime resolver (not startup libc DNS)
        # applies ipv6=off. Preserve the complete path and release query string.
        resolver 127.0.0.53 valid=60s ipv6=off;
        resolver_timeout 5s;
        set $eidolon_pages_host aeml.github.io;
        proxy_pass https://$eidolon_pages_host$request_uri;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name aeml.github.io;
        # Authenticate the Pages peer with the host's normal CA store.
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        # Must match the repository's current GitHub Pages custom domain.
        proxy_set_header Host play.eidolonrealms.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_redirect https://eidolon.mendola.tech/ https://play.eidolonrealms.com/;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name server.eidolonrealms.com;

    location / {
        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
