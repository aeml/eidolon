# Additive migration: do not replace the existing eidolon.conf.
# After installing/enabling this file, Certbot adds HTTPS and HTTP redirects.
server {
    listen 80;
    listen [::]:80;
    server_name play.eidolonrealms.com;

    location / {
        proxy_pass https://aeml.github.io;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name aeml.github.io;
        # Pages currently routes this repository by its existing custom domain.
        # Keep that routing and the old public domain intact during migration.
        proxy_set_header Host eidolon.mendola.tech;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_redirect https://eidolon.mendola.tech/ https://play.eidolonrealms.com/;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name server.eidolonrealms.com;

    location / {
        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
