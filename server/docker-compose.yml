name: eidolon

services:
  mongo:
    image: mongo:7.0.14
    restart: unless-stopped
    env_file:
      - .env
    command:
      - --auth
      - --bind_ip_all
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo 'db.runCommand({ ping: 1 }).ok' | mongosh mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@localhost:27017/admin --quiet | grep 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    # Permit admission closure, earned-work drain and durable final snapshots.
    stop_grace_period: 60s
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GO_VERSION: 1.27.1
        BUILD_COMMIT: ${EIDOLON_BUILD_COMMIT:-development}
        BUILD_VERSION: ${EIDOLON_BUILD_VERSION:-Alpha 1.78.0}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
    command:
      - --addr=:8080
      - --auth-max-concurrent=${EIDOLON_AUTH_MAX_CONCURRENT:-4}
      - --ws-max-connections=${EIDOLON_WS_MAX_CONNECTIONS:-512}
      - --mongo-uri=${MONGO_URI}
      - --log-file=${LOG_FILE:-logs/server.log}
      - --save-journal-dir=/app/logs/character-saves
      - --log-stdout=${LOG_STDOUT:-true}
      - --log-http-errors=${LOG_HTTP_ERRORS:-false}
      - --suspicious-log-file=${SUSPICIOUS_LOG_FILE:-logs/junk.log}
      - --suspicious-stdout=${SUSPICIOUS_STDOUT:-false}
      - --qa-usernames=${EIDOLON_QA_USERNAMES:-}
      - --admin-bootstrap-usernames=${EIDOLON_ADMIN_BOOTSTRAP_USERNAMES:-}
    ports:
      - 127.0.0.1:${APP_HOST_PORT:-18082}:8080
    volumes:
      - ./logs:/app/logs

  # Explicit operator opt-in only. Independent of API readiness/start order.
  # Linux host networking observes the actual loopback game upstream without
  # exposing a listener or requiring an insecure non-loopback HTTP probe.
  monitor:
    profiles: [operations]
    build:
      context: .
      dockerfile: Dockerfile
      target: monitor
      args:
        GO_VERSION: 1.27.1
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN:-}
      POSTMARK_FROM_EMAIL: ${POSTMARK_FROM_EMAIL:-}
      POSTMARK_MESSAGE_STREAM: ${POSTMARK_MESSAGE_STREAM:-}
      ADMIN_NOTIFICATION_EMAILS: ${ADMIN_NOTIFICATION_EMAILS:-}
    command:
      - --health-url=http://127.0.0.1:${APP_HOST_PORT:-18082}/healthz
      - --request-timeout=5s
      - --poll-interval=30s
      - --failure-threshold=3
      - --recovery-threshold=2
      - --notice-cooldown=30m
      - --postmark-alerts
      - --mail-timeout=10s
      - --mail-min-interval=1m
    logging:
      driver: journald
      options:
        tag: eidolon-monitor

volumes:
  mongo_data:
